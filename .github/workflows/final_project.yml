name: final_project

on:
  push:
    branches:
      - master
      - main
      - final_project
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: final_project

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # последняя версия ветки v1: конфиг курса написан в формате v1, v2 его не читает
          version: v1.64.8
          working-directory: final_project
          args: --config=../final_project/golangci.yml

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Unit and integration tests
        run: go test -race -count 100 ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build server
        run: go build -o bin/server ./cmd/server
      - name: Build client
        run: go build -o bin/client ./cmd/client

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose --profile client build
