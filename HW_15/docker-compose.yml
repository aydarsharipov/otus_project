services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: chess
      POSTGRES_DB: chess
      # пароль берётся из переменной окружения, в репозитории его нет
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
